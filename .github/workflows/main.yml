name: Build & Deploy image

on: 
  push: 
    branches: [ "dev" ] 
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: true
          token: ${{ secrets.NEUBIRD_SLACK }}

      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '16'  

      - name: Authenticate npm with GitHub Token
        run: |
          echo "//npm.pkg.github.com/:_authToken=${{ secrets.NPM_TOKEN }}" > ~/.npmrc

      - name: Install dependencies
        run: |
          npm install

      - name: Build the app
        run: |
          npm run build  

   #   - name: Create .env file
   #     run: echo "${{ secrets.DOTENV }}" > .env

      - name: Build docker image
        run: |
          docker build . -t neubirdai/hawkeye-slack:build

      - name: Set Build Timestamp
        id: set_timestamp
        run: echo "::set-output name=timestamp::$(date +'%Y%m%d-%s')"

      # Configure AWS credentials
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v2
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ap-south-1

      # Login to AWS ECR
      - name: Login to AWS ECR
        run: |
          aws ecr get-login-password --region ap-south-1 | docker login --username AWS --password-stdin 764890574198.dkr.ecr.ap-south-1.amazonaws.com

      # Build and push Docker image to ECR
      - name: Build and push Docker image
        uses: docker/build-push-action@v2
        with:
          context: .
          push: true
          tags: 764890574198.dkr.ecr.ap-south-1.amazonaws.com/neubird/slack-app:latest
